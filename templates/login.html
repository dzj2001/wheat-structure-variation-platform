<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小麦基因结构变异检测系统 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .title h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="title">
            <h1>小麦基因组结构变异检测系统</h1>
            <p>服务器登录</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="hostname">服务器地址:</label>
                <input type="text" id="hostname" name="hostname" placeholder="请输入服务器地址" required>
            </div>

            <div class="form-group">
                <label for="port">端口:</label>
                <input type="number" id="port" name="port" placeholder="请输入端口号" value="22" required>
            </div>

            <div class="form-group">
                <label for="username">用户名:</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码:</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn" id="loginBtn">连接服务器</button>
        </form>

        <div class="status" id="status">准备连接...</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const loginBtn = document.getElementById('loginBtn');
            const status = document.getElementById('status');
            const alert = document.getElementById('alert');

            loginBtn.disabled = true;
            status.textContent = '正在连接服务器...';
            alert.style.display = 'none';

            const formData = {
                hostname: document.getElementById('hostname').value,
                port: document.getElementById('port').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert.className = 'alert alert-success';
                    alert.textContent = result.message;
                    alert.style.display = 'block';
                    status.textContent = '连接成功! 正在跳转...';

                    // 跳转到主界面
                    setTimeout(() => {
                        window.location.href = '/main';
                    }, 1000);
                } else {
                    alert.className = 'alert alert-error';
                    alert.textContent = result.message;
                    alert.style.display = 'block';
                    status.textContent = '连接失败';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                alert.className = 'alert alert-error';
                alert.textContent = '网络错误: ' + error.message;
                alert.style.display = 'block';
                status.textContent = '连接失败';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
